<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="620" height="330" viewBox="0 0 620 330" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ogArrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    .box { fill:#ffffff; stroke:#000000; stroke-width:1; }
    .boxdashed { fill:#ffffff; stroke:#666666; stroke-width:1; stroke-dasharray:5,3; }
    .chip { fill:#f2f2f2; stroke:#000000; stroke-width:1; }
    .title { font-family: Arial, sans-serif; font-size:13px; font-weight:bold; text-anchor:middle; }
    .subtitle { font-family: Arial, sans-serif; font-size:10px; font-style:italic; text-anchor:middle; fill:#666666; }
    .chiplabel { font-family: Arial, sans-serif; font-size:10.5px; text-anchor:middle; }
    .note { font-family: Arial, sans-serif; font-size:10.5px; text-anchor:middle; fill:#333333; }
  </style>

  <!-- Left: MultiShape composite AbstractObject -->
  <rect class="box" x="30" y="10" width="260" height="96" rx="3"/>
  <text class="title" x="160" y="27">CubeBeamsplitter</text>
  <text class="subtitle" x="160" y="41">&lt;: AbstractObject, shape_trait_of = MultiShape</text>
  <rect class="chip" x="42" y="58" width="58" height="26"/>
  <text class="chiplabel" x="71" y="75">front</text>
  <rect class="chip" x="106" y="58" width="76" height="26"/>
  <text class="chiplabel" x="144" y="75">coating</text>
  <rect class="chip" x="188" y="58" width="58" height="26"/>
  <text class="chiplabel" x="217" y="75">back</text>

  <!-- Right: ObjectGroup -->
  <rect class="boxdashed" x="330" y="10" width="260" height="96" rx="3"/>
  <text class="title" x="460" y="27">ObjectGroup</text>
  <text class="subtitle" x="460" y="41">AbstractObjectGroup — kinematic wrapper, not an AbstractObject</text>
  <rect class="chip" x="345" y="58" width="70" height="26"/>
  <text class="chiplabel" x="380" y="75">mirror</text>
  <rect class="chip" x="425" y="58" width="90" height="26"/>
  <text class="chiplabel" x="470" y="75">detector</text>

  <!-- converging arrows -->
  <path d="M 160 106 L 300 200" stroke="#000000" stroke-width="1" marker-end="url(#ogArrow)"/>
  <path d="M 460 106 L 320 200" stroke="#000000" stroke-width="1" marker-end="url(#ogArrow)"/>
  <text class="note" x="310" y="150">recursively flattened</text>
  <text class="note" x="310" y="164">(MultiShape's shape(x) / ObjectGroup's objects(x))</text>

  <!-- Bottom: System/StaticSystem flattened pool -->
  <rect class="box" x="80" y="202" width="460" height="112" rx="3"/>
  <text class="title" x="310" y="220">System / StaticSystem</text>
  <text class="subtitle" x="310" y="234">objects(system) → flat Vector{AbstractObject} (trace targets)</text>

  <rect class="chip" x="95" y="250" width="76" height="28"/>
  <text class="chiplabel" x="133" y="268">front</text>
  <rect class="chip" x="183" y="250" width="76" height="28"/>
  <text class="chiplabel" x="221" y="268">coating</text>
  <rect class="chip" x="271" y="250" width="76" height="28"/>
  <text class="chiplabel" x="309" y="268">back</text>
  <rect class="chip" x="359" y="250" width="76" height="28"/>
  <text class="chiplabel" x="397" y="268">mirror</text>
  <rect class="chip" x="447" y="250" width="76" height="28"/>
  <text class="chiplabel" x="485" y="268">detector</text>

  <text class="note" x="310" y="300">Only these leaves are ever a target of intersect3d/interact3d.</text>
</svg>
