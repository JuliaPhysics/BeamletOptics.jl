<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="480" height="300" viewBox="0 0 480 300" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="rsArrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
    <marker id="rsArrowGray" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <style>
    .box { fill:#ffffff; stroke:#000000; stroke-width:1; }
    .title { font-family: Arial, sans-serif; font-size:13px; font-weight:bold; text-anchor:middle; }
    .field { font-family: Arial, sans-serif; font-size:11px; text-anchor:middle; fill:#333333; }
    .note { font-family: Arial, sans-serif; font-size:10px; font-style:italic; text-anchor:middle; fill:#666666; }
    .edgelabel { font-family: Arial, sans-serif; font-size:10px; text-anchor:middle; fill:#333333; }
  </style>

  <!-- Beam box -->
  <rect class="box" x="140" y="8" width="180" height="40" rx="3"/>
  <text class="title" x="230" y="24">Beam{T,R}</text>
  <text class="field" x="230" y="40">segments::Vector{R}</text>

  <path d="M 230 48 L 230 68" stroke="#000000" stroke-width="1" marker-end="url(#rsArrow)"/>

  <!-- Ray box -->
  <rect class="box" x="110" y="70" width="240" height="56" rx="3"/>
  <text class="title" x="230" y="87">R &lt;: AbstractRay{T,S}</text>
  <text class="field" x="230" y="103">λ, n</text>
  <text class="field" x="230" y="118">segment::S</text>

  <path d="M 230 126 L 230 146" stroke="#000000" stroke-width="1" marker-end="url(#rsArrow)"/>

  <!-- Segment abstract box -->
  <rect class="box" x="150" y="148" width="160" height="30" rx="3"/>
  <text class="title" x="230" y="167">S &lt;: AbstractSegment{T}</text>

  <!-- split arrows -->
  <path d="M 190 178 L 110 208" stroke="#000000" stroke-width="1" marker-end="url(#rsArrow)"/>
  <path d="M 270 178 L 360 208" stroke="#000000" stroke-width="1" marker-end="url(#rsArrow)"/>

  <!-- OpenSegment box -->
  <rect class="box" x="20" y="210" width="180" height="76" rx="3"/>
  <text class="title" x="110" y="227">OpenSegment{T}</text>
  <text class="field" x="110" y="243">pos, dir</text>
  <text class="field" x="110" y="258">accumulated_opl</text>
  <text class="note" x="110" y="275">no hit yet (unresolved)</text>

  <!-- LineSegment box -->
  <rect class="box" x="280" y="210" width="190" height="76" rx="3"/>
  <text class="title" x="375" y="227">LineSegment{T}</text>
  <text class="field" x="375" y="243">p0, dir</text>
  <text class="field" x="375" y="258">intersection::Intersection{T}</text>
  <text class="note" x="375" y="275">hit found (resolved)</text>

  <!-- transition arrow between OpenSegment and LineSegment -->
  <path d="M 200 248 L 278 248" stroke="#666666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#rsArrowGray)"/>
  <text class="edgelabel" x="239" y="240" fill="#666666">intersect3d</text>
</svg>
