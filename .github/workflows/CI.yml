name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # A Julia prerelease may break dependencies before they release a fix (e.g. #173): its job runs
    # and reports, but does not fail the CI
    continue-on-error: ${{ matrix.version == 'pre' }}
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
        # Coverage of this repository and bounds checks of its @inbounds code on one job only: each
        # set of flags needs its own build of all dependencies (8 min on 1.12, #216)
        include:
          - version: '1'
            coverage: true
            flags: --code-coverage=@${{ github.workspace }} --check-bounds=yes
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Instantiate the test environment
        shell: julia --project=test --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          using Pkg
          Pkg.instantiate()
      # Tests do not need fast first calls, and every change of BMO would compile the workloads again.
      # Not a file of the repository, such that local test runs keep them; the docs build with them
      - name: Switch off the precompile workloads
        run: printf '[BeamletOptics]\nprecompile_workload = false\n' > test/LocalPreferences.toml
      # A step of its own, such that the log shows its time and the workers do not wait for it
      - name: Precompile
        run: julia --project=test --color=yes ${{ matrix.flags }} -e 'using Pkg; Pkg.precompile()'
      # The test environment on the load path, such that the preference also holds in the environment
      # in which Aqua precompiles the package (persistent tasks)
      - name: Run tests
        env:
          JULIA_LOAD_PATH: "@:${{ github.workspace }}/test:@stdlib"
        run: julia --project=test --color=yes ${{ matrix.flags }} test/runtests.jl --jobs=4
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      # Install OpenGL dependencies for headless rendering.
      - name: Install OpenGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils
      # Precompilation is skipped here: GLMakie needs a display to initialize, which only
      # exists inside xvfb-run below.
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          using Pkg
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      # Run docs in xvfb environment.
      - name: Deploy documentation with xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            julia --project=docs --color=yes -e 'using Documenter; include("docs/make.jl")'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      # Run doctests in xvfb environment.
      - name: Run doctests with xvfb
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" \
            julia --project=docs --color=yes -e '
              using Documenter: DocMeta, doctest;
              using BeamletOptics;
              DocMeta.setdocmeta!(BeamletOptics, :DocTestSetup, :(using BeamletOptics); recursive=true);
              doctest(BeamletOptics)
            '
